<!DOCTYPE html>
<html>

<head>

<title>Morde-Tech Bot Pairing</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:Arial,sans-serif;
    color:white;

    background:
    linear-gradient(
        120deg,
        #050014,
        #4c1d95,
        #0f172a,
        #050014
    );

    background-size:400% 400%;
    animation:bgMove 10s infinite alternate;

}



@keyframes bgMove{

from{
    background-position:0% 50%;
}

to{
    background-position:100% 50%;
}

}



.card{

    width:390px;
    padding:30px;

    text-align:center;

    background:
    rgba(255,255,255,0.08);

    backdrop-filter:blur(20px);

    border-radius:25px;

    box-shadow:
    0 0 30px #a855f7,
    0 0 70px #22d3ee;

}



.logo{

    font-size:60px;

}



h1{

    color:#f0abfc;

}



.qr{

    width:240px;
    height:240px;

    margin:20px auto;

    padding:15px;

    background:white;

    border-radius:20px;

}



.qr img{

    width:100%;
    height:100%;

}



input{

    width:100%;

    padding:15px;

    border:none;

    border-radius:12px;

    outline:none;

    font-size:16px;

}



button{

    width:100%;

    padding:15px;

    margin-top:15px;

    border:none;

    border-radius:12px;

    background:#a855f7;

    color:white;

    font-size:17px;

    cursor:pointer;

}



button:hover{

    background:#9333ea;

}



#code{

    margin-top:20px;

    font-size:28px;

    letter-spacing:5px;

    color:#22d3ee;

}



.status{

    color:#ccc;

}


</style>

</head>


<body>


<div class="card">


<div class="logo">
🤖
</div>


<h1>
Morde-Tech Bot
</h1>


<p>
WhatsApp Pairing System
</p>



<div class="qr">

<img 
id="qr"
src="/qr.png"
alt="QR Code">

</div>



<input 
id="number"
placeholder="2547XXXXXXXX"
type="text">



<button onclick="getPair()">

🔑 Get Pair Code

</button>



<div id="code">

</div>



<p class="status" id="status">

Waiting...

</p>


</div>




<script>


async function getPair(){


const number =
document.getElementById("number").value;



if(!number){

alert(
"Enter WhatsApp number"
);

return;

}



document.getElementById("status")
.innerHTML =
"Generating pairing code...";



try{


const response =
await fetch(
"/pair?number=" + number
);



const data =
await response.json();



if(data.code){


document.getElementById("code")
.innerHTML =
data.code;



document.getElementById("status")
.innerHTML =
"✅ Code generated. Enter it in WhatsApp Linked Devices";


}

else{


document.getElementById("status")
.innerHTML =
"❌ " + data.error;

}



}

catch(error){


document.getElementById("status")
.innerHTML =
"❌ Server not connected";


}


}



// Auto refresh QR

setInterval(()=>{


document.getElementById("qr").src =
"/qr.png?t=" + Date.now();


},3000);



</script>


</body>

</html>
