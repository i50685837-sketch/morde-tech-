<!DOCTYPE html>
<html>
<head>

<title>Morde-Tech Bot Pairing</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body {
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    linear-gradient(135deg,#120024,#2b1055,#090014);
    font-family:Arial,sans-serif;
    color:white;
}


.card {

    width:360px;
    padding:30px;
    text-align:center;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(15px);
    border-radius:25px;
    border:1px solid rgba(255,255,255,0.2);
    box-shadow:0 0 30px #a855f7;

}


h1 {

    color:#d8b4fe;

}


input {

    width:90%;
    padding:14px;
    margin:12px 0;
    border:none;
    border-radius:12px;
    outline:none;

}


button {

    width:95%;
    padding:14px;
    background:#a855f7;
    color:white;
    border:none;
    border-radius:12px;
    font-size:16px;
    cursor:pointer;

}


button:hover {

    background:#9333ea;

}


.qr {

    margin:20px auto;
    background:white;
    padding:15px;
    width:230px;
    height:230px;
    border-radius:20px;

}


.qr img {

    width:100%;
    height:100%;

}


#code {

    color:#f0abfc;
    font-size:25px;
    letter-spacing:5px;

}


.status {

    color:#ddd;

}

</style>

</head>


<body>


<div class="card">

<h1>🤖 Morde-Tech Bot</h1>

<p>Scan QR or use pairing code</p>


<div class="qr">

<img id="qr" src="/qr.png">

</div>


<input
id="number"
placeholder="2547XXXXXXXX">


<button onclick="pair()">
Get Pair Code
</button>


<h2 id="code"></h2>


<p class="status">
Waiting for WhatsApp connection...
</p>


</div>


<script>

async function pair(){

let number =
document.getElementById("number").value;


if(!number){

alert("Enter WhatsApp number");

return;

}


let res =
await fetch(
"/pair?number="+number
);


let data =
await res.json();


document.getElementById("code").innerHTML =
data.code || "Waiting...";

}



setInterval(()=>{

document.getElementById("qr").src =
"/qr.png?t="+Date.now();

},3000);


</script>


</body>
  </html>
